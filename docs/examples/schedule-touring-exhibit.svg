<text x="30" y="67" fill="#15263a" font-size="34" font-weight="700" text-anchor="start">What sets the touring exhibit’s opening?</text>
<text x="30" y="92" fill="#4b6072" font-size="16" font-weight="400" text-anchor="start">Activity-on-node schedule · durations and float in days</text>
