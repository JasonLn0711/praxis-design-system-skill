<svg xmlns="http://www.w3.org/2000/svg" width="800" height="468" viewBox="0 0 800 468" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">Where 100 repair items go</title>
<desc id="desc">One hundred items arrive. Seventy-five are handled at the café: 48 fixed and 27 waiting for parts. Of 25 externally routed items, 17 are referred and 8 recycled.</desc>
