<svg xmlns="http://www.w3.org/2000/svg" width="800" height="468" viewBox="0 0 800 468" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">Borrow an accessible museum guide</title>
<desc id="desc">Four columns show arrival, pickup, visit and return. The visitor and visible staff actions sit above a visibility line, with backstage and support work below it.</desc>
<rect x="0.5" y="0.5" width="799" height="467" fill="#f7f9fb" stroke="#c5d3dd" rx="15"/>
<text x="30" y="29" fill="#006c55" font-size="12" font-weight="700" text-anchor="start" letter-spacing=".8">SERVICE BLUEPRINT</text>
<text x="30" y="67" fill="#15263a" font-size="34" font-weight="700" text-anchor="start">Borrow an accessible museum guide</text>
<text x="30" y="92" fill="#4b6072" font-size="16" font-weight="400" text-anchor="start">The visitor’s actions and the work behind the service</text>
<line x1="30" y1="109" x2="770" y2="109" stroke="#c5d3dd" stroke-width="1"/>
<rect x="150" y="140" width="144" height="39" fill="#15263a" stroke="none" rx="6"/>
<text x="222" y="165" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Arrive</text>
<rect x="305" y="140" width="144" height="39" fill="#15263a" stroke="none" rx="6"/>
<text x="377" y="165" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Pick up</text>
<rect x="460" y="140" width="144" height="39" fill="#15263a" stroke="none" rx="6"/>
<text x="532" y="165" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Visit</text>
<rect x="615" y="140" width="144" height="39" fill="#15263a" stroke="none" rx="6"/>
<text x="687" y="165" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Return</text>
<text x="30" y="217" fill="#15263a" font-size="16" font-weight="700" text-anchor="start">Visitor</text>
<g><rect x="150" y="190" width="144" height="44" fill="#ffffff" stroke="#c5d3dd" rx="6"/>
<text x="222.0" y="208.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Find loan</text>
<text x="222.0" y="226.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">desk</text></g>
<g><rect x="305" y="190" width="144" height="44" fill="#ffffff" stroke="#c5d3dd" rx="6"/>
<text x="377.0" y="208.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Request</text>
<text x="377.0" y="226.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">a device</text></g>
<g><rect x="460" y="190" width="144" height="44" fill="#ffffff" stroke="#c5d3dd" rx="6"/>
<text x="532.0" y="208.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Use the</text>
<text x="532.0" y="226.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">audio guide</text></g>
<g><rect x="615" y="190" width="144" height="44" fill="#ffffff" stroke="#c5d3dd" rx="6"/>
<text x="687.0" y="208.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Hand back</text>
<text x="687.0" y="226.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">the device</text></g>
<text x="30" y="272" fill="#15263a" font-size="16" font-weight="700" text-anchor="start">Frontstage</text>
<g><rect x="150" y="245" width="144" height="44" fill="#ffffff" stroke="#c5d3dd" rx="6"/>
<text x="222.0" y="263.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Show loan</text>
<text x="222.0" y="281.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">signage</text></g>
<g><rect x="305" y="245" width="144" height="44" fill="#ffffff" stroke="#c5d3dd" rx="6"/>
<text x="377.0" y="263.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Pair</text>
<text x="377.0" y="281.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">headphones</text></g>
<g><rect x="460" y="245" width="144" height="44" fill="#ffffff" stroke="#c5d3dd" rx="6"/>
<text x="532.0" y="263.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Offer volume</text>
<text x="532.0" y="281.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">help</text></g>
<g><rect x="615" y="245" width="144" height="44" fill="#ffffff" stroke="#c5d3dd" rx="6"/>
<text x="687.0" y="263.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Confirm</text>
<text x="687.0" y="281.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">return</text></g>
<text x="30" y="342" fill="#15263a" font-size="16" font-weight="700" text-anchor="start">Backstage</text>
<g><rect x="150" y="315" width="144" height="44" fill="#e6f0f6" stroke="#c5d3dd" rx="6"/>
<text x="222.0" y="333.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Count ready</text>
<text x="222.0" y="351.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">devices</text></g>
<g><rect x="305" y="315" width="144" height="44" fill="#e6f0f6" stroke="#c5d3dd" rx="6"/>
<text x="377.0" y="333.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Assign a</text>
<text x="377.0" y="351.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">device ID</text></g>
<g><rect x="460" y="315" width="144" height="44" fill="#e6f0f6" stroke="#c5d3dd" rx="6"/>
<text x="532.0" y="333.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Keep a</text>
<text x="532.0" y="351.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">spare ready</text></g>
<g><rect x="615" y="315" width="144" height="44" fill="#e1f3ec" stroke="#006c55" rx="6"/>
<text x="687.0" y="333.0" fill="#006c55" font-size="15" font-weight="600" text-anchor="middle">Clean and</text>
<text x="687.0" y="351.0" fill="#006c55" font-size="15" font-weight="600" text-anchor="middle">recharge</text></g>
<text x="30" y="397" fill="#15263a" font-size="16" font-weight="700" text-anchor="start">Support</text>
<g><rect x="150" y="370" width="144" height="44" fill="#e6f0f6" stroke="#c5d3dd" rx="6"/>
<text x="222.0" y="388.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Inventory</text>
<text x="222.0" y="406.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">list</text></g>
<g><rect x="305" y="370" width="144" height="44" fill="#e6f0f6" stroke="#c5d3dd" rx="6"/>
<text x="377.0" y="388.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Loan</text>
<text x="377.0" y="406.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">register</text></g>
<g><rect x="460" y="370" width="144" height="44" fill="#e6f0f6" stroke="#c5d3dd" rx="6"/>
<text x="532.0" y="388.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Help</text>
<text x="532.0" y="406.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">guide</text></g>
<g><rect x="615" y="370" width="144" height="44" fill="#e6f0f6" stroke="#c5d3dd" rx="6"/>
<text x="687.0" y="388.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">Cleaning</text>
<text x="687.0" y="406.0" fill="#15263a" font-size="15" font-weight="600" text-anchor="middle">checklist</text></g>
<line x1="150" y1="239" x2="759" y2="239" stroke="#c5d3dd" stroke-width="1"/>
<line x1="150" y1="364" x2="759" y2="364" stroke="#c5d3dd" stroke-width="1"/>
<line x1="30" y1="301" x2="759" y2="301" stroke="#15263a" stroke-width="2"/>
<rect x="30" y="291" width="120" height="19" fill="#f7f9fb" stroke="none" rx="0"/>
<text x="31" y="305" fill="#15263a" font-size="12" font-weight="700" text-anchor="start" letter-spacing=".8">VISIBILITY LINE</text>
<line x1="30" y1="420" x2="770" y2="420" stroke="#c5d3dd" stroke-width="1"/>
<text x="30" y="449" fill="#4b6072" font-size="15" font-weight="500" text-anchor="start">Cleaning and charging after return make the next loan possible.</text>
</svg>
