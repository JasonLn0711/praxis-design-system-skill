<svg xmlns="http://www.w3.org/2000/svg" width="800" height="468" viewBox="0 0 800 468" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">When people visit the library</title>
<desc id="desc">Clockwise from midnight the arrivals are 18, 42, 90, 112, 84 and 38. The peak is 112 visits between noon and four p.m. Ray length, not area, represents the number of visits.</desc>
