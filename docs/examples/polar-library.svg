<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370"
     role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
  <title id="title">Library arrivals polar chart</title>
  <desc id="desc">Clockwise from midnight, the four-hour windows record 18, 42, 90, 112, 84 and 38 visits. Radius measures visits linearly. The noon to four p.m. window is busiest.</desc>
  <rect width="680" height="370" fill="#112432"/>
  <circle cx="340" cy="182" r="40" fill="none" stroke="#426775" stroke-width="1.25"/>
  <circle cx="340" cy="182" r="80" fill="none" stroke="#426775" stroke-width="1.25"/>
  <circle cx="340" cy="182" r="120" fill="none" stroke="#426775" stroke-width="1.25"/>
  <path d="M340 182 L333.26 165.31 A18 18 0 0 1 346.74 165.31Z" fill="#4cafb3" stroke="#75eec9" stroke-width="1.2"/>
  <text x="340" y="25" fill="#cfebe9" font-size="16" text-anchor="middle" font-weight="600">00–04</text>
  <text x="340" y="45" fill="#75eec9" font-size="17" text-anchor="middle" font-weight="750">18</text>
  <path d="M340 182 L365.86 148.90 A42 42 0 0 1 381.59 176.15Z" fill="#4cafb3" stroke="#75eec9" stroke-width="1.2"/>
  <text x="475.966" y="103.5" fill="#cfebe9" font-size="16" text-anchor="middle" font-weight="600">04–08</text>
  <text x="475.966" y="123.5" fill="#75eec9" font-size="17" text-anchor="middle" font-weight="750">42</text>
  <path d="M340 182 L429.12 194.53 A90 90 0 0 1 395.41 252.92Z" fill="#4cafb3" stroke="#75eec9" stroke-width="1.2"/>
  <text x="475.966" y="260.5" fill="#cfebe9" font-size="16" text-anchor="middle" font-weight="600">08–12</text>
  <text x="475.966" y="280.5" fill="#75eec9" font-size="17" text-anchor="middle" font-weight="750">90</text>
  <path d="M340 182 L381.96 285.84 A112 112 0 0 1 298.04 285.84Z" fill="#a9ffdc" stroke="#75eec9" stroke-width="1.2"/>
  <text x="340" y="339" fill="#cfebe9" font-size="16" text-anchor="middle" font-weight="600">12–16</text>
  <text x="340" y="359" fill="#75eec9" font-size="17" text-anchor="middle" font-weight="750">112</text>
  <path d="M340 182 L288.28 248.19 A84 84 0 0 1 256.82 193.69Z" fill="#4cafb3" stroke="#75eec9" stroke-width="1.2"/>
  <text x="204.034" y="260.5" fill="#cfebe9" font-size="16" text-anchor="middle" font-weight="600">16–20</text>
  <text x="204.034" y="280.5" fill="#75eec9" font-size="17" text-anchor="middle" font-weight="750">84</text>
  <path d="M340 182 L302.37 176.71 A38 38 0 0 1 316.60 152.06Z" fill="#4cafb3" stroke="#75eec9" stroke-width="1.2"/>
  <text x="204.034" y="103.5" fill="#cfebe9" font-size="16" text-anchor="middle" font-weight="600">20–24</text>
  <text x="204.034" y="123.5" fill="#75eec9" font-size="17" text-anchor="middle" font-weight="750">38</text>
  <text x="380" y="185" fill="#ddf5f1" font-size="11" text-anchor="middle" font-weight="550" stroke="#112432" stroke-width="4" paint-order="stroke">40</text>
  <text x="420" y="185" fill="#ddf5f1" font-size="11" text-anchor="middle" font-weight="550" stroke="#112432" stroke-width="4" paint-order="stroke">80</text>
  <text x="460" y="185" fill="#ddf5f1" font-size="11" text-anchor="middle" font-weight="550" stroke="#112432" stroke-width="4" paint-order="stroke">120</text>
  <text x="518" y="185" fill="#cfebe9" font-size="15" text-anchor="start" font-weight="550">Visits</text>
</svg>
