<svg xmlns="http://www.w3.org/2000/svg" width="800" height="468" viewBox="0 0 800 468" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif">
<title id="title">What proves the exhibit is accessible?</title>
<desc id="desc">Captions and keyboard access have linked tests. Accessible transcript has a linked design but no verification evidence.</desc>
<rect x="0.5" y="0.5" width="799" height="467" fill="#f7f9fb" stroke="#c5d3dd" rx="15"/>
<text x="30" y="29" fill="#006c55" font-size="12" font-weight="700" text-anchor="start" letter-spacing=".8">REQUIREMENT TRACEABILITY</text>
<text x="30" y="67" fill="#15263a" font-size="34" font-weight="700" text-anchor="start">What proves the exhibit is accessible?</text>
<text x="30" y="92" fill="#4b6072" font-size="16" font-weight="400" text-anchor="start">Follow each requirement from the brief to its verification</text>
