name: Validate skill pack

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python for independent YAML parsing
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned YAML parser
        shell: pwsh
        run: python -m pip install -r requirements-dev.txt

      - name: Parse skill metadata with PyYAML
        shell: pwsh
        run: |
          python .\scripts\validate-yaml.py
          python -m unittest .\tests\test_yaml_validation.py

      - name: Validate skills
        shell: pwsh
        run: .\validate.ps1

      - name: Run integration tests
        shell: pwsh
        run: .\tests\run-tests.ps1
