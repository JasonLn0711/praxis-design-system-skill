<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Modal fixture</title></head><body>
<button id="open">Delete account</button>
<div id="modal" hidden><div>Confirm deletion</div><div id="confirm">Confirm</div><div id="cancel">Cancel</div></div>
<script>open.onclick=()=>modal.hidden=false; cancel.onclick=()=>modal.hidden=true;</script>
</body></html>
